apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: findee-deny-internal
spec:
  ipAllowList:
    # Broadcast address cannot be a TCP client. Reject every ingress caller.
    # Use the remote peer address (default); never trust X-Forwarded-For here.
    sourceRange:
      - "255.255.255.255/32"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: findee-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - findmus.com
      secretName: findee-tls

  rules:
    - host: findmus.com
      http:
        paths:
          - path: /
            pathType: Prefix
            # Forward matching requests to the service on port 3002.
            backend:
              service:
                name: findee-service
                port:
                  number: 3002
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: findee-internal-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: findee-findee-deny-internal@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "10000"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - findmus.com
      secretName: findee-tls
  rules:
    - host: findmus.com
      http:
        paths:
          - path: /api/internal
            pathType: Prefix
            backend:
              service:
                name: findee-service
                port:
                  number: 3002
